name: Compile Protocols

on:
  push:
    branches:
      - main
    paths:
      - 'protocols/proto/**'
      - 'protocols/Makefile'
      - 'protocols/package.json'
      - 'protocols/go.mod'

jobs:
  compile-protocols:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install gRPC C++ plugin
        run: |
          sudo apt-get install -y protobuf-compiler-grpc

      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install npm dependencies
        working-directory: protocols
        run: npm install

      - name: Clean existing generated files
        working-directory: protocols
        run: make clean

      - name: Compile protocols for all platforms
        working-directory: protocols
        run: make all
        env:
          PROTOC_INCLUDES: /usr/include/google/protobuf

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated protocols
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: regenerate protocol bindings for all platforms

          Auto-generated by GitHub Actions after protocol changes.

          Platforms: C++, Go, TypeScript"
          git push
