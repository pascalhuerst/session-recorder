name: Release

# Build arm64 .deb packages and publish a GitHub Release when a version tag is
# pushed, e.g. `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  backend-deb:
    name: Backend .deb (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cross-compile backend (arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -C go -o dist/session-recorder-server ./cmd/session_recorder_server

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb
        run: |
          mkdir -p dist
          nfpm package --packager deb --config go/packaging/nfpm.yaml \
            --target "dist/session-recorder-server_${VERSION}_arm64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deb
          path: dist/*.deb
          if-no-files-found: error

  reader-deb:
    name: ALSA reader .deb (arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/recorder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross and cargo-deb
        run: |
          cargo install cross --locked
          cargo install cargo-deb --locked

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stage protos into the crate
        # cross mounts only the crate dir, so copy the protos inside it and
        # point build.rs at them via PROTO_DIR.
        run: cp -r ../../protocols/proto ./proto

      - name: Cross-compile reader (arm64)
        env:
          PROTO_DIR: proto
          PROTOC: /usr/local/bin/protoc
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Build .deb
        run: |
          cargo deb --no-build --no-strip \
            --target aarch64-unknown-linux-gnu \
            --deb-version "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-deb
          path: rust/recorder/target/aarch64-unknown-linux-gnu/debian/*.deb
          if-no-files-found: error

  web-deb:
    name: Web UI .deb (all)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go (for nfpm)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web UI (same-origin /grpc)
        working-directory: web
        env:
          VITE_GRPC_SERVER_URL: /grpc
        run: pnpm nx build

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb
        run: |
          mkdir -p dist
          nfpm package --packager deb --config web/packaging/nfpm.yaml \
            --target "dist/session-recorder-web_${VERSION}_all.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-deb, reader-deb, web-deb]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
