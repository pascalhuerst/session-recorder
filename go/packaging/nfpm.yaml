# nfpm config for the Session Recorder backend (.deb and .rpm).
# Run from the REPO ROOT (all paths below are repo-root-relative):
#   GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
#     go build -C go -o dist/session-recorder-server ./cmd/session_recorder_server
#   VERSION=1.2.3 nfpm package --packager deb --config go/packaging/nfpm.yaml \
#     --target dist/session-recorder-server_1.2.3_arm64.deb
#   VERSION=1.2.3 nfpm package --packager rpm --config go/packaging/nfpm.yaml \
#     --target dist/session-recorder-server-1.2.3.aarch64.rpm
#
# ${VERSION} is supplied via env (e.g. the git tag without the leading 'v').
name: session-recorder-server
arch: arm64
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: Pascal Huerst <pascal.huerst@gmail.com>
description: |
  Session Recorder backend.
  Hosts the ChunkSink and SessionSource gRPC services and an embedded
  gRPC-Web listener for the web UI.
homepage: https://github.com/pascalhuerst/session-recorder
license: MIT

# data.flac, data.ogg (Ogg/Opus) and waveform.dat are all generated in-process
# in pure Go — no sox/audiowaveform runtime dependency. User creation uses
# useradd/groupadd, present on both Debian (passwd, essential) and Fedora.
overrides:
  rpm:
    depends:
      - shadow-utils # provides useradd/groupadd on Fedora

contents:
  - src: go/dist/session-recorder-server
    dst: /usr/bin/session-recorder-server
    file_info:
      mode: 0755

  - src: go/packaging/session-recorder-server.service
    dst: /lib/systemd/system/session-recorder-server.service

  - src: go/packaging/session-recorder-server.default
    dst: /etc/default/session-recorder-server
    type: config|noreplace

scripts:
  postinstall: go/packaging/postinst.sh
  preremove: go/packaging/prerm.sh
  postremove: go/packaging/postrm.sh
