; WS2812 ring controller — I2C slave on Arduino Uno (ATmega328P)
;
; Build/upload:   pio run -t upload
; Serial monitor: pio device monitor
;
; If your I2C master is a 3.3V device (e.g. Raspberry Pi) you MUST use a
; bidirectional level shifter on SDA/SCL. The firmware disables the Uno's
; internal pull-ups so the shifter / master provides them.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED @ ^3.6.0

build_flags =
    ; --- compile-time hardware config (override here, not in code) ---
    -D LED_PIN=6          ; WS2812 DIN pin, channel 0 (e.g. left)
    -D LED_PIN2=7         ; WS2812 DIN pin, channel 1 (e.g. right)
    -D NUM_LEDS=16        ; pixels per ring (both channels)
    -D I2C_ADDRESS=0x20   ; 7-bit I2C slave address
