syntax = "proto3";

package common;

option go_package = "github.com/pascalhuerst/session-recorder/protocols/go/common";

enum SignalStatus {
    UNKNOWN = 0;
    NO_SIGNAL = 1;
    SIGNAL = 2;
}   

message RecorderStatus {
    string recorderID = 1;
    string recorderName = 2;

    SignalStatus signalStatus = 3;
    double peakPercent = 4;
    bool clipping = 5;

    // Most recently computed Chromaprint audio fingerprint for this
    // recorder's current session, recomputed every few seconds over a
    // rolling window while recording. Empty until the first window has
    // been fingerprinted.
    string chromaprintFingerprint = 6;
}

message Respone {
	bool success = 1;
	string errorMessage = 2;
}