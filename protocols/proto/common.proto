syntax = "proto3";

package common;

option go_package = "github.com/pascalhuerst/session-recorder/protocols/go/common";

enum SignalStatus {
    UNKNOWN = 0;
    NO_SIGNAL = 1;
    SIGNAL = 2;
}   

message RecorderStatus {
    string recorderID = 1;
    string recorderName = 2;

    SignalStatus signalStatus = 3;
    double rmsPercent = 4;
    bool clipping = 5;
    // Highest absolute sample of the same window as rmsPercent, in percent of
    // full scale. Recorders older than this field leave it at 0.
    double peakPercent = 6;
}

message Respone {
	bool success = 1;
	string errorMessage = 2;
}