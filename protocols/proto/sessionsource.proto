syntax = "proto3";

package sessionsource;

import "common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/pascalhuerst/session-recorder/protocols/go/sessionsource";

message StreamRecordersRequest {}

message RecordereRemoved {}

message Recorder {
	string recorderID = 1;
	string recorderName = 2;

	oneof info {
		common.RecorderStatus status = 3;
		RecordereRemoved removed = 4;
	}
}

message StreamSessionRequest {
	string recorderID = 1;
}

enum SegmentState {
	SEGMENT_STATE_UNKNOWN = 0;
	SEGMENT_STATE_RENDERING = 1;
	SEGMENT_STATE_FINISHED = 2;
	SEGMENT_STATE_ERROR = 3;
	SEGMENT_STATE_QUEUED = 4;
}

message SegmentInfo {
	google.protobuf.Timestamp timeStart = 1;
	google.protobuf.Timestamp timeEnd = 2;

	string name = 3;
	SegmentState state = 4;

	message Files {
		string ogg = 1;
		string flac = 2;
	}
	Files inlineFiles = 5;
	Files downloadFiles = 6;
	string errorMessage = 7;
}

message SegmentRemoved {}

message Segment {
	string segmentID = 1;

	oneof info {
		SegmentInfo updated = 2;
		SegmentRemoved removed = 3;
	}
}

enum SessionState {
	SESSION_STATE_UNKNOWN = 0;
	SESSION_STATE_RECORDING = 1;
	SESSION_STATE_FINISHED = 2;
	SESSION_STATE_PROCESSING = 3;
	SESSION_STATE_ERROR = 4;
}

message SessionInfo {
    message Files {
        string ogg = 1;
        string flac = 2;
        string waveform = 3;
    }

	google.protobuf.Timestamp timeCreated = 2;
	google.protobuf.Timestamp timeFinished = 3;
	google.protobuf.Duration lifetime = 4;

	string name = 5;
	bool keep = 8;

	SessionState state = 9;

	repeated Segment segments = 10;

	Files inlineFiles = 11;
	Files downloadFiles = 12;

	string errorMessage = 13;
}

message SessionRemoved {}

message Session {
	string ID = 1;

	oneof info {
		SessionInfo updated = 2;
		SessionRemoved removed = 3;
	}
}

message SetKeepSessionRequest {
	string recorderID = 1;
	string sessionID = 2;
	bool keep = 3;
}

message DeleteSessionRequest {
	string recorderID = 1;
	string sessionID = 2;
}

message SetNameRequest {
	string recorderID = 1;
	string sessionID = 2;
	string name = 3;
}

message CreateSegmentRequest {
	string recorderID = 1;
	string sessionID = 2;
	string segmentID = 3;
	SegmentInfo info = 4;
}

message UpdateSegmentRequest {
	string recorderID = 1;
	string sessionID = 2;
	string segmentID = 3;
	SegmentInfo info = 4;
}

message DeleteSegmentRequest {
	string recorderID = 1;
	string sessionID = 2;
	string segmentID = 3;
}

message RenderSegmentRequest {
	string recorderID = 1;
	string sessionID = 2;
	string segmentID = 3;
}

message CutSessionRequest {
	string recorderID = 1;
}

message ShareSessionRequest {
	string recorderID = 1;
	string sessionID = 2;
	repeated string recipientEmails = 3;
}

message ShareSegmentRequest {
	string recorderID = 1;
	string sessionID = 2;
	string segmentID = 3;
	repeated string recipientEmails = 4;
}

message StreamSessionAudioRequest {
	string sessionID = 1;
}

message AudioChunk {
	string sessionID = 1;
	repeated int32 samples = 2;
	uint32 chunkNumber = 3;
	google.protobuf.Timestamp timestamp = 4;
}

// Show management

enum ShowState {
	SHOW_STATE_DRAFT = 0;
	SHOW_STATE_LIVE = 1;
	SHOW_STATE_ENDED = 2;
	SHOW_STATE_ARCHIVED = 3;
}

message ActInfo {
	string actID = 1;
	string name = 2;
	google.protobuf.Timestamp plannedStart = 3;
	google.protobuf.Timestamp plannedEnd = 4;
	repeated string emails = 5;
	string segmentID = 6;
	google.protobuf.Timestamp actualStart = 7;
	google.protobuf.Timestamp actualEnd = 8;
}

message ShowInfo {
	string showID = 1;
	string name = 2;
	google.protobuf.Timestamp date = 3;
	ShowState state = 4;
	string recorderID = 5;
	string sessionID = 6;
	repeated ActInfo acts = 7;
}

message CreateShowRequest {
	ShowInfo show = 1;
}

message UpdateShowRequest {
	ShowInfo show = 1;
}

message DeleteShowRequest {
	string showID = 1;
}

message ListShowsRequest {}

message ListShowsResponse {
	repeated ShowInfo shows = 1;
}

message StartShowRequest {
	string showID = 1;
}

message RenderAllRequest {
	string showID = 1;
}

message DistributeAllRequest {
	string showID = 1;
}

message AdvanceActRequest {
	string showID = 1;
}

service SessionSource {
	// Stream
	rpc StreamRecorders(StreamRecordersRequest) returns (stream Recorder);
	rpc StreamSessions(StreamSessionRequest) returns (stream Session);
	rpc StreamSessionAudio(StreamSessionAudioRequest) returns (stream AudioChunk);

	// Unary
	rpc SetKeepSession(SetKeepSessionRequest) returns (common.Respone);
	rpc DeleteSession(DeleteSessionRequest) returns (common.Respone);
	rpc SetName(SetNameRequest) returns (common.Respone);

	rpc CreateSegment(CreateSegmentRequest) returns (common.Respone);
	rpc DeleteSegment(DeleteSegmentRequest) returns (common.Respone);
	rpc RenderSegment(RenderSegmentRequest) returns (common.Respone);
	rpc UpdateSegment(UpdateSegmentRequest) returns (common.Respone);

	rpc CutSession(CutSessionRequest) returns (common.Respone);

	rpc ShareSession(ShareSessionRequest) returns (common.Respone);
	rpc ShareSegment(ShareSegmentRequest) returns (common.Respone);

	// Shows
	rpc CreateShow(CreateShowRequest) returns (common.Respone);
	rpc UpdateShow(UpdateShowRequest) returns (common.Respone);
	rpc DeleteShow(DeleteShowRequest) returns (common.Respone);
	rpc ListShows(ListShowsRequest) returns (ListShowsResponse);
	rpc StartShow(StartShowRequest) returns (common.Respone);
	rpc RenderAll(RenderAllRequest) returns (common.Respone);
	rpc DistributeAll(DistributeAllRequest) returns (common.Respone);
	rpc AdvanceAct(AdvanceActRequest) returns (common.Respone);
}
