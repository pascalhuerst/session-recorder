[package]
name = "chunk-source"
version = "0.1.0"
edition = "2024"

[dependencies]
alsa = "0.9"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
core_affinity = "0.8"
ringbuf = "0.4"
num-traits = "0.2"
libc = "0.2"
ctrlc = "3.4"
evdev = "0.13"
tokio = { version = "1.0", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
mdns-sd = "0.10"
gethostname = "0.5"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6.1", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"
