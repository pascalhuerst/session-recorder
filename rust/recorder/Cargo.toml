[package]
name = "recorder"
version = "0.1.0"
edition = "2024"
description = "Session Recorder ALSA reader — captures audio and streams it to the backend (ChunkSink protocol client)."
license = "MIT"
homepage = "https://github.com/pascalhuerst/session-recorder"

[dependencies]
alsa = "0.9"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
core_affinity = "0.8"
ringbuf = "0.4"
num-traits = "0.2"
libc = "0.2"
ctrlc = "3.4"
evdev = "0.13"
tokio = { version = "1.0", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
mdns-sd = "0.10"
gethostname = "0.5"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
# D-Bus client for the Avahi discovery backend. zbus is pure Rust (no libdbus /
# C dependency), so it cross-compiles to arm64 with the rest of the recorder.
zbus = { version = "5", default-features = false, features = ["tokio"] }
async-trait = "0.1"
futures-util = "0.3"

[build-dependencies]
tonic-build = "0.12"

# Debian packaging (cargo-deb). The installed artifact is named
# session-recorder-alsa-reader; the cargo crate/binary stays `recorder`.
# Build for arm64:
#   cross build --release --target aarch64-unknown-linux-gnu
#   cargo deb --no-build --no-strip --target aarch64-unknown-linux-gnu
[package.metadata.deb]
name = "session-recorder-alsa-reader"
section = "sound"
priority = "optional"
# libasound2 was renamed libasound2t64 in the time64 transition (trixie+);
# accept either. adduser is needed by the postinst.
depends = "libasound2 | libasound2t64, adduser"
# The default discovery backend talks to the system avahi-daemon over D-Bus.
# Recommended (not required) since --discovery mdns works without them.
recommends = "avahi-daemon, dbus"
maintainer-scripts = "packaging"
conf-files = ["/etc/default/session-recorder-alsa-reader"]
assets = [
    ["target/release/recorder", "usr/bin/session-recorder-alsa-reader", "755"],
    ["packaging/session-recorder-alsa-reader.service", "lib/systemd/system/session-recorder-alsa-reader.service", "644"],
    ["packaging/session-recorder-alsa-reader.default", "etc/default/session-recorder-alsa-reader", "644"],
]
