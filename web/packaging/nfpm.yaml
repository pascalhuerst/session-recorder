# nfpm config for the Session Recorder web UI (.deb and .rpm,
# architecture-independent). Run from the REPO ROOT (paths are repo-relative):
#   cd web && VITE_GRPC_SERVER_URL=/grpc pnpm nx build && cd ..
#   VERSION=1.2.3 nfpm package --packager deb --config web/packaging/nfpm.yaml \
#     --target dist/session-recorder-web_1.2.3_all.deb
#   VERSION=1.2.3 nfpm package --packager rpm --config web/packaging/nfpm.yaml \
#     --target dist/session-recorder-web-1.2.3.noarch.rpm
#
# Debian and Fedora lay out nginx differently, so the nginx site install path
# and maintainer scripts are overridden per packager (see `overrides` below):
#   deb -> /etc/nginx/sites-available + a sites-enabled symlink (managed by the
#          scripts, which also disable the stock default site)
#   rpm -> /etc/nginx/conf.d/*.conf (auto-included by the stock nginx.conf)
#
# ${VERSION} is supplied via env (the git tag without the leading 'v').
name: session-recorder-web
arch: all
platform: linux
version: ${VERSION}
section: web
priority: optional
maintainer: Pascal Huerst <pascal.huerst@gmail.com>
description: |
  Session Recorder web interface (static files + nginx site).
  Serves the Vue UI and reverse-proxies /grpc to the backend and /minio for
  audio playback.
homepage: https://github.com/pascalhuerst/session-recorder
license: MIT

depends:
  - nginx

# Static assets are identical for both packagers; only the nginx site path and
# maintainer scripts differ, so contents+scripts are specified per packager.
# (nfpm replaces `contents` per packager but *merges* `scripts` key-by-key, so
# keeping scripts only inside the overrides avoids the deb scripts leaking into
# the rpm.)
overrides:
  deb:
    contents:
      - src: web/dist/web
        dst: /usr/share/session-recorder-web
        type: tree

      - src: web/packaging/session-recorder-web.nginx
        dst: /etc/nginx/sites-available/session-recorder-web
        type: config|noreplace
    scripts:
      postinstall: web/packaging/postinst.sh
      preremove: web/packaging/prerm.sh

  rpm:
    contents:
      - src: web/dist/web
        dst: /usr/share/session-recorder-web
        type: tree

      - src: web/packaging/session-recorder-web.nginx
        dst: /etc/nginx/conf.d/session-recorder-web.conf
        type: config|noreplace
    scripts:
      postinstall: web/packaging/postinst.rpm.sh
      postremove: web/packaging/postrm.rpm.sh
